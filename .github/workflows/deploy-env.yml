name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 40
    env:
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend

      - name: Snapshot database (Neon branch "pre-deploy")
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: bash .github/scripts/neon-snapshot.sh

      - name: Migrate database
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic current
          alembic upgrade head
          alembic current

      - name: Trigger Render deploy of this exact commit (API)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail-with-body -sS -X POST "$HOOK&ref=$GITHUB_SHA"

      - name: Wait until the API serves this commit
        run: bash .github/scripts/wait-for-commit.sh "$API_URL/health"

      - name: API can query the database
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' "$API_URL/smoke-check-missing")
          cat body.json; echo
          test "$code" = "404"

      - name: Security headers on API
        run: |
          headers=$(curl -s -D - -o /dev/null "$API_URL/health")
          echo "$headers"
          echo "$headers" | grep -qi "^x-content-type-options: nosniff"
          echo "$headers" | grep -qi "^content-security-policy: default-src 'none'"

      - name: Trigger Render deploy of this exact commit (web)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: curl --fail-with-body -sS -X POST "$HOOK&ref=$GITHUB_SHA"

      - name: Wait until the site serves this commit
        run: bash .github/scripts/wait-for-commit.sh "$WEB_URL/version.json"

      - name: Site's index page loads
        run: curl --fail -sS "$WEB_URL/" | grep -q '<div id="root">'

      - name: Site forwards /api to the API (same-origin proxy)
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' -X POST "$WEB_URL/api/auth/refresh")
          cat body.json; echo
          test "$code" = "401"
          grep -q '"detail"' body.json

      - name: Security headers on web
        run: |
          headers=$(curl -s -D - -o /dev/null "$WEB_URL/")
          echo "$headers"
          echo "$headers" | grep -qi "^content-security-policy:.*frame-ancestors 'none'"
          echo "$headers" | grep -qi "^x-content-type-options: nosniff"
