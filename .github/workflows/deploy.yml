name: Deploy

on:
  push:
    branches: ["release/**", main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate-uat:
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: ci
    runs-on: ubuntu-latest
    environment: uat
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - name: Revision before
        run: alembic current
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Revision after
        run: alembic current
  deploy-uat:
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: migrate-uat
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Trigger Render deploy of this exact commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail-with-body -sS -X POST "$HOOK&ref=$GITHUB_SHA"
  smoke-uat:
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 15
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Wait until UAT serves this commit
        run: |
          for i in $(seq 1 40); do
            commit=$(curl -s --max-time 30 "$API_URL/health" | jq -r '.commit // empty' 2>/dev/null || true)
            echo "attempt $i: UAT is serving '${commit:-no response}', want $GITHUB_SHA"
            if [ ${#commit} -ge 7 ] && [[ "$GITHUB_SHA" == "$commit"* ]]; then
              echo "UAT is running this commit"
              exit 0
            fi
            sleep 15
          done
          echo "UAT did not start serving $GITHUB_SHA within 10 minutes"
          exit 1

      - name: App can query the database
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' "$API_URL/api/stats/smoke-check-missing")
          cat body.json; echo
          test "$code" = "404"
